<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Lumalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/register.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html"><span class="brand-mark">L</span><span>Lumalia</span></a>
  <p class="login-text">Déjà inscrit ? <a href="../connexion/">Connexion</a></p>
</header>

<main class="register-page">
<section class="register-card">
  <div class="eyebrow"><span></span> COMPTE LUMALIA</div>
  <h1>Créer votre compte<br><span>Lumalia</span></h1>
  <p class="intro">Un compte unique pour accéder à tous les univers et services Lumalia.</p>

  <div id="message" class="message" role="alert" aria-live="polite"></div>

  <form id="register-form" novalidate>
    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required>
      <small id="email-error" class="field-error"></small>
    </div>

    <div class="field">
      <div class="label-row">
        <label for="username">Pseudo Lumalia</label>
        <button id="suggest" type="button">✦ Suggérer</button>
      </div>
      <input id="username" type="text" autocomplete="username" placeholder="@ votrepseudo" minlength="3" maxlength="32" required>
      <p class="hint">3 à 32 caractères. Lettres, chiffres, _ et -.</p>
      <small id="username-error" class="field-error"></small>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <div class="password-wrap">
        <input id="password" type="password" autocomplete="new-password" placeholder="Au moins 12 caractères" minlength="12" required>
        <button type="button" class="password-toggle" data-target="password">◉</button>
      </div>
      <div class="strength">
        <span class="strength-track"><span id="strength-bar"></span></span>
        <span id="strength-label">Entrez un mot de passe</span>
      </div>
      <small id="password-error" class="field-error"></small>
    </div>

    <div class="field">
      <label for="confirm">Confirmation</label>
      <div class="password-wrap">
        <input id="confirm" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" required>
        <button type="button" class="password-toggle" data-target="confirm">◉</button>
      </div>
      <small id="confirm-error" class="field-error"></small>
    </div>

    <label class="terms">
      <input id="terms" type="checkbox" required>
      <span>J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a> de Lumalia.</span>
    </label>
    <small id="terms-error" class="field-error terms-error"></small>

    <button id="submit" class="submit-button" type="submit">
      <span id="submit-text">Créer mon compte</span>
      <span id="loader" class="loader" hidden></span>
    </button>
  </form>

  <p class="security">⌾ &nbsp; Votre compte est protégé par Firebase Authentication.</p>
</section>
</main>

<script type="module" src="js/register.js"></script>
</body>
</html>
