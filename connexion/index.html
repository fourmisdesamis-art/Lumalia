<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer un compte — Lumalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/register.css"></head>
<body>
<header><a class="brand" href="../index.html"><b>L</b><span>Lumalia</span></a><div>Déjà inscrit ? <a href="../connexion/">Connexion</a></div></header>
<main><section class="card">
<div class="eyebrow"><i></i> COMPTE LUMALIA</div>
<h1>Créer votre compte<br><em>Lumalia</em></h1>
<p class="intro">Un compte unique pour accéder à tous les univers et services Lumalia.</p>
<div id="message" class="message"></div>
<form id="register-form">
<label>Adresse e-mail<input id="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required></label>
<small id="email-error"></small>
<div class="labelrow"><label for="username">Pseudo Lumalia</label><button id="suggest" type="button">✦ Suggérer</button></div>
<input id="username" type="text" placeholder="@ votrepseudo" minlength="3" maxlength="32" required>
<p class="hint">3 à 32 caractères. Lettres, chiffres, _ et -.</p><small id="username-error"></small>
<label>Mot de passe<div class="password"><input id="password" type="password" placeholder="Au moins 12 caractères" minlength="12" required><button type="button" data-target="password">◉</button></div></label>
<div class="strength"><span id="bar"></span><label id="strength-label">Entrez un mot de passe</label></div><small id="password-error"></small>
<label>Confirmation<div class="password"><input id="confirm" type="password" placeholder="Confirmer le mot de passe" required><button type="button" data-target="confirm">◉</button></div></label><small id="confirm-error"></small>
<label class="terms"><input id="terms" type="checkbox" required><span>J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a> de Lumalia.</span></label><small id="terms-error"></small>
<button class="submit" id="submit" type="submit"><span id="submit-text">Créer mon compte</span><span id="loader" hidden>Création…</span></button>
</form>
<div class="security">⌾ &nbsp; Votre compte est protégé par Firebase Authentication.</div>
</section></main>
<script type="module" src="js/register.js"></script></body></html>
