<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maintenance en cours</title>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONFIG
     ============================================================ */
  var MAINTENANCE   = true;              // true = page active + verrouillée | false = désactivée
  var REDIRECT_URL  = "index.html";      // où rediriger quand MAINTENANCE = false
  /* ============================================================ */

  /* --- Si la maintenance est désactivée : on renvoie vers le site --- */
  if (MAINTENANCE === false) {
    window.location.replace(REDIRECT_URL);
    return;
  }

  /* --- Sinon : on verrouille la page --- */
  function verrouiller() {

    /* 1) Bouton retour / avance bloqué */
    try {
      history.pushState({ __lock: true }, "", location.href);
      window.addEventListener("popstate", function () {
        history.pushState({ __lock: true }, "", location.href);
      });
    } catch (e) {}

    /* 2) Confirmation navigateur avant fermeture / navigation */
    window.addEventListener("beforeunload", function (e) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    });

    /* 3) Raccourcis clavier de navigation */
    window.addEventListener("keydown", function (e) {
      var k   = (e.key || "").toLowerCase();
      var mod = e.ctrlKey || e.metaKey;

      // Alt + ← / →
      if (e.altKey && (k === "arrowleft" || k === "arrowright")) {
        e.preventDefault(); e.stopPropagation(); return false;
      }
      // Backspace hors champ de saisie
      if (k === "backspace" && !/^(input|textarea|select)$/i.test(e.target.tagName || "")) {
        e.preventDefault(); return false;
      }
      // Ctrl/Cmd + L / T / N / W
      if (mod && (k === "l" || k === "t" || k === "n" || k === "w")) {
        e.preventDefault(); return false;
      }
      // F5 et Ctrl+R restent autorisés (recharger ne fait pas quitter la page)
    }, true);

    /* 4) Liens et formulaires bloqués (au cas où il y en aurait) */
    document.addEventListener("click", function (e) {
      var a = e.target && e.target.closest && e.target.closest("a[href]");
      if (a) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    document.addEventListener("submit", function (e) {
      e.preventDefault(); e.stopPropagation();
    }, true);

    /* 5) Glisser-déposer de fichier = navigation → bloqué */
    ["dragover", "drop"].forEach(function (ev) {
      window.addEventListener(ev, function (e) { e.preventDefault(); }, false);
    });

    /* 6) Si la page est dans une iframe, on casse le cadre */
    if (window.top !== window.self) {
      try { window.top.location.href = window.location.href; } catch (e) {}
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", verrouiller);
  } else {
    verrouiller();
  }
})();
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    background: #0b1020;
    color: #e2e8f0;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;                 /* pas de scroll */
    position: relative;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Halo animé en arrière-plan */
  body::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 25% 25%, rgba(99, 102, 241, .35), transparent 45%),
      radial-gradient(circle at 78% 72%, rgba(139, 92, 246, .30), transparent 45%),
      radial-gradient(circle at 50% 105%, rgba(56, 189, 248, .22), transparent 50%);
    animation: derive 20s ease-in-out infinite alternate;
  }
  @keyframes derive {
    from { transform: translate3d(-3%, -3%, 0) scale(1); }
    to   { transform: translate3d(3%, 3%, 0) scale(1.12); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(560px, 100%);
    padding: 52px 40px 44px;
    text-align: center;
    border-radius: 24px;
    border: 1px solid rgba(148, 163, 184, .16);
    background: rgba(15, 23, 42, .62);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, .9),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    animation: apparait .8s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes apparait {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  .icon {
    width: 88px;
    height: 88px;
    margin: 0 auto 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(99, 102, 241, .35);
    background: radial-gradient(circle at 30% 30%,
                rgba(99, 102, 241, .35),
                rgba(99, 102, 241, .08));
    box-shadow: 0 0 40px rgba(99, 102, 241, .35);
  }
  .icon svg {
    width: 44px;
    height: 44px;
    stroke: #a5b4fc;
    transform-origin: 50% 50%;
    animation: tourne 8s linear infinite;
  }
  @keyframes tourne { to { transform: rotate(360deg); } }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: -.02em;
    margin-bottom: 14px;
  }

  p {
    color: #94a3b8;
    line-height: 1.65;
    font-size: .98rem;
  }

  .bar {
    position: relative;
    margin-top: 32px;
    height: 6px;
    border-radius: 99px;
    overflow: hidden;
    background: rgba(148, 163, 184, .15);
  }
  .bar::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 40%;
    border-radius: 99px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #38bdf8);
    animation: glisse 1.8s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes glisse {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  .hint {
    margin-top: 22px;
    font-size: .8rem;
    color: #64748b;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 24px 34px; border-radius: 20px; }
    .icon { width: 72px; height: 72px; margin-bottom: 22px; }
    .icon svg { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>

      </svg>
    </div>

    <h1>Maintenance en cours</h1>
    <p>
      Le site est actuellement en maintenance.<br>
      Une nouvelle mise à jour du site arrive, merci de patienter
    </p>

    <div class="bar"></div>
    <p class="hint">Ne fermez pas cette page.</p>
  </div>

</body>
</html>
