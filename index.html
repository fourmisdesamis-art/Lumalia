<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumalia</title>
    <!-- Lien vers ton CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Icônes FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Fond étoilé (géré en CSS) -->
    <div class="background-space"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="assets/img/logo.png" alt="Logo Lumalia">
                Lumalia
            </a>

            <!-- Liens de navigation -->
            <ul class="nav-links">
                <li><a href="#">News</a></li>
                <li><a href="#">Serveurs</a></li>
                <li><a href="#">Wiki</a></li>
                <li><a href="#">Launcher</a></li>
                
                <!-- Menu déroulant Communauté -->
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Communauté</a>
                    <!-- La bande qui apparait -->
                    <ul class="dropdown-content">
                        <li><a href="#">Forum</a></li>
                        <li><a href="#">Staff</a></li>
                    </ul>
                </li>
            </ul>

            <!-- Partie droite -->
            <div class="nav-right">
                <div class="lang-selector">
                    <span>FR</span>
                    <i class="fa-regular fa-sun"></i>
                </div>

                <!-- Menu Compte (Anilyse) -->
                <div class="account-section">
                    <button id="account-btn" class="account-btn">
                        <img src="https://minotar.net/helm/Anilyse/24.png" alt="icon" class="account-icon">
                        <span id="username-display">Anilyse</span> 
                        <i class="fa-solid fa-chevron-down arrow"></i>
                    </button>

                    <!-- Menu déroulant du compte -->
                    <div id="account-menu" class="dropdown-menu">
                        <!-- Vue Connecté -->
                        <div id="logged-in-view">
                            <a href="/dashboard">Dashboard</a>
                            <a href="/parametres">Paramètres</a>
                            <hr>
                            <a href="#" id="logout-btn" class="logout-link">Déconnexion</a>
                        </div>
                        
                        <!-- Vue Déconnecté -->
                        <div id="logged-out-view" style="display: none;">
                            <a href="/connexion">Connexion</a>
                            <a href="/inscription">Inscription</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== SECTION PRINCIPALE ===== -->
    <main class="hero">
        
        <!-- Les blocs Minecraft en fond (à remplacer par tes vraies images si tu les as) -->
        <div class="bg-blocks">
            <div class="block block-white"></div>
            <div class="block block-blue"></div>
            <div class="block block-green"></div>
            <div class="block block-red"></div>
        </div>

        <!-- Texte central -->
        <div class="hero-content">
            <h1>Des serveurs,<br>plusieurs histoires</h1>
            
            <div class="hero-buttons">
                <a href="#" class="btn btn-cyan">Nous rejoindre</a>
                <a href="#" class="btn btn-gray">Explorez le Serveur</a>
            </div>
        </div>

        <!-- Badge Galactique Update (Image) -->
        <a href="#" class="galactic-badge">
            <img src="assets/img/GalactiqueUpdateMJ.png" alt="Galactique Update">
        </a>
    </main>

    <!-- Lien vers ton JS -->
    <script type="module" src="assets/js/script.js"></script>
</body>
</html>
