<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumalia - Serveurs Minecraft</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icônes FontAwesome pour le look pro -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            
            <!-- Logo -->
            <a href="#" class="logo">
                <img src="https://via.placeholder.com/30/ff69b4/ffffff?text=L" alt="Logo Lumalia">
                Lumalia
            </a>

            <!-- Liens de navigation -->
            <ul class="nav-links">
                <li><a href="#">News</a></li>
                <li><a href="#">Serveurs</a></li>
                <li><a href="#">Wiki</a></li>
                <li><a href="#">Launcher</a></li>
                
                <!-- Menu déroulant Communauté (au survol) -->
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Communauté <i class="fa-solid fa-chevron-down"></i></a>
                    <ul class="dropdown-content">
                        <li><a href="#">Forum</a></li>
                        <li><a href="#">Staff</a></li>
                    </ul>
                </li>
            </ul>

            <!-- Partie droite : Langue + Compte -->
            <div class="nav-right">
                <div class="lang-selector">
                    <span>FR</span>
                    <i class="fa-solid fa-sun"></i>
                </div>

                <!-- Menu Compte (Anilyse) -->
                <div class="account-section">
                    <button id="account-btn" class="account-btn">
                        <img src="https://via.placeholder.com/20/8c9eb5/ffffff?text=U" alt="icon" class="account-icon">
                        <span id="username-display">Connexion</span> 
                        <i class="fa-solid fa-chevron-down arrow"></i>
                    </button>

                    <!-- Menu déroulant du compte -->
                    <div id="account-menu" class="dropdown-menu">
                        <!-- Vue Connecté -->
                        <div id="logged-in-view" style="display: none;">
                            <a href="/dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                            <a href="/parametres"><i class="fa-solid fa-gear"></i> Paramètres</a>
                            <hr>
                            <a href="#" id="logout-btn" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a>
                        </div>
                        
                        <!-- Vue Déconnecté -->
                        <div id="logged-out-view">
                            <a href="/connexion"><i class="fa-solid fa-right-to-bracket"></i> Connexion</a>
                            <a href="/inscription"><i class="fa-solid fa-user-plus"></i> Inscription</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== SECTION HERO (Contenu principal) ===== -->
    <main class="hero">
        <div class="hero-content">
            <h1>Des serveurs,<br>plusieurs histoires</h1>
            
            <div class="hero-buttons">
                <a href="#" class="btn btn-primary">Nous rejoindre</a>
                <a href="#" class="btn btn-secondary">Explorez le Serveur</a>
            </div>
        </div>

        <!-- Badge en bas à gauche -->
        <a href="#" class="galactic-badge">GALACTIQUE UPDATE</a>
    </main>

    <!-- Le script Firebase (type module) -->
    <script type="module" src="script.js"></script>
</body>
</html>
