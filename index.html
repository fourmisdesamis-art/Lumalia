<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumalia</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Icônes FontAwesome pour le soleil et la flèche -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- L'IMAGE DE FOND GALACTIQUE UPDATE -->
    <div class="background-container">
        <img src="assets/img/GalactiqueUpdateMJ.png" alt="Fond Galactique" class="bg-image">
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            
            <!-- Logo (Image + Texte) -->
            <a href="#" class="logo">
                <img src="assets/img/logo.png" alt="Logo Lumalia" class="logo-img">
                <span class="logo-text">Lumalia</span>
            </a>

            <!-- Liens de navigation -->
            <ul class="nav-links">
                <li><a href="#">News</a></li>
                <li><a href="#">Serveurs</a></li>
                <li><a href="#">Wiki</a></li>
                <li><a href="#">Launcher</a></li>
                
                <!-- Menu Communauté (CORRIGÉ POUR NE PAS DISPARAÎTRE) -->
                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">Communauté</a>
                    <!-- Ce conteneur invisible comble le vide pour que la souris ne sorte pas -->
                    <div class="dropdown-wrapper">
                        <ul class="dropdown-content">
                            <li><a href="#">Forum</a></li>
                            <li><a href="#">Staff</a></li>
                        </ul>
                    </div>
                </li>
            </ul>

            <!-- Partie droite -->
            <div class="nav-right">
                <div class="lang-selector">
                    <span>FR</span>
                    <i class="fa-regular fa-sun sun-icon"></i>
                </div>

                <!-- Menu Compte (Anilyse) -->
                <div class="account-section">
                    <button id="account-btn" class="account-btn">
                        <img src="assets/img/logo.png" alt="icon" class="account-icon"> <!-- J'ai mis ton logo en attendant ta tête de joueur -->
                        <span id="username-display">Anilyse</span> 
                        <i class="fa-solid fa-chevron-down arrow"></i>
                    </button>

                    <!-- Menu déroulant du compte -->
                    <div id="account-menu" class="dropdown-menu">
                        <div id="logged-in-view">
                            <a href="#">Dashboard</a>
                            <a href="#">Paramètres</a>
                            <hr>
                            <a href="#" id="logout-btn" class="logout-link">Déconnexion</a>
                        </div>
                        <div id="logged-out-view" style="display: none;">
                            <a href="#">Connexion</a>
                            <a href="#">Inscription</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== SECTION PRINCIPALE ===== -->
    <main class="hero">
        <!-- Texte central -->
        <div class="hero-content">
            <h1>Des serveurs,<br>plusieurs histoires</h1>
            
            <div class="hero-buttons">
                <a href="#" class="btn btn-cyan">Nous rejoindre</a>
                <a href="#" class="btn btn-gray">Explorez le Serveur</a>
            </div>
        </div>
    </main>

    <script type="module" src="assets/js/script.js"></script>
</body>
</html>
