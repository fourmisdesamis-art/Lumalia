<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>maintenance - Lumalia</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="script.js" defer></script>
</head>
<body>
    <button class="theme-toggle" type="button" aria-label="Basculer le thème" aria-pressed="false" title="Passer au thème sombre">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 15.9A8.5 8.5 0 0 1 8.1 3.8 8.5 8.5 0 1 0 20.2 15.9Z"/>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
        </svg>
    </button>
    <main class="container">
        <div class="header">
            <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="currentColor"/>
            </svg>
            <span class="brand-name">Lumalia</span>
        </div>

        <h1>Mise à jour en cours</h1>
        <p class="subtitle">
            Une nouvelle version du site est en cours d'installation.
        </p>

        <p class="launch-status" role="status">Installation de la nouvelle version</p>
        <div class="progress-track" role="progressbar" aria-label="Mise à jour du site" aria-valuetext="En cours">
            <span class="progress-indicator" aria-hidden="true"></span>
        </div>

        <hr>
        <div class="notice">
            <p class="notice-label">Maintenance en cours</p>
            <p class="info-text">
                <strong>Le site est temporairement indisponible.</strong>
            </p>
            <p class="info-text">
                Le site reviendra dans une semaine. L'équipe a publié une annonce sur le Discord.
            </p>
        </div>

        <a href="https://discord.gg/xvFxyzWTzF" target="_blank" rel="noopener noreferrer" class="btn-discord">
            Ouvrir le Discord
        </a>
    </main>
</body>
</html>
