<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Maintenance - Lumalia</title>
    
    <!-- Script de configuration et de verrouillage -->
    <script>
        (function() {
            // ==========================================
            // CONFIGURATION
            const MAINTENANCE = true; // true = active le blocage | false = redirige vers le site
            const RELOAD_TIME = 60000; // Rechargement auto toutes les 60 secondes (60000 ms)
            // ==========================================

            // Si la maintenance est désactivée, on redirige
            if (MAINTENANCE === false) {
                window.location.replace(REDIRECT_URL);
                return;
            }

            // Si la maintenance est active, on lance le verrouillage
            window.addEventListener('DOMContentLoaded', () => {
                
                // 1. Rechargement automatique de la page
                setTimeout(() => {
                    window.location.reload();
                }, RELOAD_TIME);

                // 2. Bloquer le bouton "Retour" (Ajout d'un historique factice)
                try {
                    history.pushState(null, null, location.href);
                    window.addEventListener('popstate', function() {
                        history.pushState(null, null, location.href);
                    });
                } catch(e) {}

                // 3. Popup de confirmation si on essaie de fermer l'onglet
                window.addEventListener('beforeunload', function(e) {
                    e.preventDefault();
                    e.returnValue = "Le site est en maintenance. Voulez-vous vraiment quitter ?";
                    return e.returnValue;
                });

                // 4. Bloquer les raccourcis clavier de navigation
                window.addEventListener('keydown', function(e) {
                    // Alt + Flèche gauche/droite
                    if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
                        e.preventDefault();
                    }
                    // Retour arrière (hors champ de texte)
                    if (e.key === "Backspace" && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                        e.preventDefault();
                    }
                    // Ctrl/Cmd + L (barre d'adresse) ou W (fermer onglet)
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'w')) {
                        e.preventDefault();
                    }
                });
            });
        })();
    </script>

    <style>
        /* Design inspiré de ton image */
        * {

            font-size: 1.4rem;

        .subtitle {

        }

        .btn-discord {

</head>
